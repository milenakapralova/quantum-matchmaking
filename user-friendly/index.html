<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>User-friendly design · Solutions Forward Challenges</title>
<link rel="icon" href="../matchmaking-tool/favicon.svg" type="image/svg+xml">
<style>
  @font-face {
    font-family: Shape;
    src: url("../matchmaking-tool/fonts/ShapeRegular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: Shape;
    src: url("../matchmaking-tool/fonts/ShapeBold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --black: #000;
    --white: #fff;
    --ink: #111;
    --muted: #5c5c5c;
    --line: #d9d9d9;
    --blue: #00f;
    --font: Shape, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--white); color: var(--ink); }
  body {
    font-family: var(--font);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.45;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 32px 64px; }
  header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; border-bottom: 1px solid var(--black); padding-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 148px; height: auto; display: block; }
  .event { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin: 28px 0 8px; font-weight: 400; letter-spacing: -0.03em; text-transform: uppercase; font-size: clamp(40px, 6vw, 64px); line-height: 0.95; }
  .lead { max-width: 40rem; margin: 0 0 22px; }
  .lead a { color: var(--blue); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; }
  .bar input { flex: 1; min-width: 220px; border: 1px solid var(--black); padding: 12px 14px; background: var(--white); }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
  .cats button, .count {
    border: 1px solid var(--black);
    background: var(--white);
    padding: 8px 12px;
    text-align: left;
  }
  .cats button.on { background: var(--black); color: var(--white); }
  .count { color: var(--muted); }
  .label { margin: 22px 0 8px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  .principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 8px; }
  .principles button { border: 1px solid var(--black); background: var(--white); text-align: left; padding: 12px 14px; }
  .principles button.on { background: var(--black); color: var(--white); }
  .principles strong { display: block; font-weight: 500; letter-spacing: -0.02em; text-transform: uppercase; font-size: 16px; margin-bottom: 4px; }
  .principles span { display: block; color: var(--muted); font-size: 14px; letter-spacing: -0.02em; line-height: 1.35; }
  .principles button.on span { color: #cfcfcf; }
  .ask { margin: 0 0 8px; color: var(--blue); font-size: 15px; }
  .grid { display: grid; gap: 12px; }
  article { border: 1px solid var(--black); padding: 16px 18px 14px; }
  article h2 { margin: 0 0 14px; font-size: 22px; font-weight: 500; letter-spacing: -0.03em; text-transform: uppercase; }
  article ul { margin: 0; padding: 0; list-style: none; }
  article li { margin: 0 0 16px; }
  article li:last-child { margin-bottom: 0; }
  .why { display: block; color: var(--blue); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
  .because { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  .empty { color: var(--muted); }
  @media (max-width: 1000px) {
    .principles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .principles { grid-template-columns: 1fr; }
    .wrap { padding: 20px 18px 48px; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="logo"></div>
    <p class="event">Matchmaking · 26 November 2026</p>
  </header>
  <h1>User-friendly design</h1>
  <p class="lead">Twelve principles behind the asks, then each ask with the reason it was worth making. The written version is <a href="design-asks.md">design-asks.md</a>.</p>
  <p class="label">Why</p>
  <div class="principles" id="principles"></div>
  <p class="label">The asks</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search the asks" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="list"></div>
</div>
<script>
const LOGO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 210.89 64" fill="none" aria-label="QDNL"><g fill="#000"><path d="m127.36 62.37 4.73 6-3.59 2.68-4.82-6.23a16.64 16.64 0 0 1-7.23 1.64c-9.19 0-16.32-7.23-16.32-16.42s7.14-16.42 16.32-16.42 16.37 7.23 16.37 16.42c0 4.96-2.09 9.32-5.46 12.32Zm-10.92-.64c1.5 0 2.86-.23 4.14-.73l-4.96-6.32 3.55-2.68 5.18 6.59c2.09-2.09 3.27-5.09 3.27-8.55 0-6.68-4.5-11.69-11.19-11.69s-11.14 5-11.14 11.69 4.5 11.69 11.14 11.69ZM165.91 50.04c0 9.28-6.73 15.92-16.46 15.92h-10.19V34.13h10.19c9.73 0 16.46 6.64 16.46 15.92Zm-5.18 0c0-6.82-4.27-11.23-11.41-11.23h-5.05v22.46h5.05c7.14 0 11.41-4.41 11.41-11.23M172.32 34.13h4.77l17.28 23.55h.04V34.13h5v31.83h-4.77l-17.23-23.51h-.09v23.51h-5zM228.89 61.28v4.68h-20.78V34.13h5v27.15z"/></g><circle cx="50" cy="50" r="32" fill="#000"/><path fill="#fff" d="M56.57 58.41c9.28-7.25 10.93-20.66 3.68-29.94s-20.66-10.93-29.94-3.68l26.27 33.62Z"/><path fill="#fff" d="M56.57 58.41c-4.64 3.63-5.47 10.33-1.84 14.97 3.51 4.5 9.91 5.41 14.53 2.17.15-.11.3-.21.44-.33z"/></svg>';
document.getElementById("logo").innerHTML = LOGO;

const PRINCIPLES = [
  { id: "where", title: "Know where you are", line: "The first look tells you the place and the first thing to do." },
  { id: "path", title: "One path", line: "You move through a known sequence, and you can see how far along that sequence you are." },
  { id: "words", title: "Short words", line: "A title, an arrow, or the picture already says it, so the sentence can go." },
  { id: "room", title: "Look like the room", line: "Tables, chairs, and names should be recognisable as the event you walked into." },
  { id: "truth", title: "The picture tells the truth", line: "The drawing shows who is actually there, and it stays the drawing you supplied." },
  { id: "seat", title: "Each seat is one role", line: "Left to right has a fixed meaning, and the challenge owner is a chair." },
  { id: "touch", title: "Touch the thing", line: "The card, the chair, or the icon is the control." },
  { id: "stay", title: "Stay where you are", line: "The page holds still, and the next action stays on the screen." },
  { id: "fit", title: "Keep it all in view", line: "A name, a decision, or a row of people stays fully visible." },
  { id: "qdnl", title: "Feel like QDNL", line: "The logo, the type, and the blue are the organisation's." },
  { id: "say", title: "Say what it is", line: "A label carries the real weight of the thing: a menu is a menu, an example is a conversation starter." },
  { id: "shared", title: "One room for everyone", line: "Whoever opens the site is looking at the same tables." }
];

const GROUPS = [
  {
    id: "start",
    title: "Know where to start",
    prompt: "The first screen was overwhelming.",
    asks: [
      ["where", "Begin on the table room, and make it obvious that this is a room of tables.", "The first screen is the room, so there is a place to stand."],
      ["words", "Replace the long room introduction with the title only: Table room.", "The title is the introduction."],
      ["where", "From that room, make it easy to start something new.", "Starting a table is the action the room is for, so it sits in that room."],
      ["path", "Show how many steps a new table has, and what opens next, so navigation is not a surprise.", "You can see how many steps there are, and which one opens next."],
      ["words", "Use words sparingly. Back is a back arrow. Next is a forward arrow.", "A direction is an arrow."],
      ["words", "The header carries the event: Matchmaking · 26 November 2026. The extra eyebrow line goes away.", "The event name in the header is enough to place you."]
    ]
  },
  {
    id: "look",
    title: "Look like QDNL",
    prompt: "The tool should feel like QDNL, and be easier to scan.",
    asks: [
      ["qdnl", "Use the real QDNL logo, including as the favicon.", "The mark on the page and in the tab is the organisation you are already in."],
      ["qdnl", "Use the QDNL typeface for headings and for the main text.", "Headings and body text are the same voice."],
      ["qdnl", "Prompts are Quantum Delta blue.", "A prompt is the organisation's blue, so it reads as a prompt."],
      ["qdnl", "Black and white stay the base. The add-table button inverts the furniture to white.", "The add button is a black block, so the furniture on it is white."],
      ["qdnl", "The challenge-owner chair is the same blue, on the table picture only. On the black add button, every chair and the table are white.", "Blue is reserved for the challenge owner on the table. On the black button the whole table is white, so the mark stays one colour."]
    ]
  },
  {
    id: "room",
    title: "A room that looks like tables",
    prompt: "Opening the tool should feel like a restaurant floor, not a list of cards.",
    asks: [
      ["room", "Five tables in a row on a wide screen. Two on a narrow one.", "A wide floor of tables reads as a room you can scan."],
      ["truth", "A finished table is drawn as a table with the people who are actually there. Chairs, or the table, can be missing.", "A chair appears when that person is here."],
      ["truth", "If nobody is marked here, the picture is just the table.", "With nobody seated, the furniture is the table."],
      ["say", "Tables have a name only. No table number.", "The room knows a table by its name."],
      ["say", "A table with no name is called Untitled.", "A table with no name yet still has a name you can read."],
      ["where", "The name is the first thing you can set.", "The name is how the room will recognise the table, so it comes first."],
      ["stay", "Started tables sit on the floor with the others, marked In progress. Continue-links under the title get in the way.", "A table you started is still a table on the floor, so you continue it there."],
      ["stay", "Clicking a table blurs the rest of the room and shows that table.", "Opening a table keeps you in the room. The other tables recede."],
      ["words", "Close is an X, not the word Close.", "Close is the mark for close."]
    ]
  },
  {
    id: "controls",
    title: "Adding, exporting, deleting",
    prompt: "The room controls are icons of one height, not sentences.",
    asks: [
      ["touch", "New table is a plus together with a full table, built from the separate chair and table icons, all in white.", "The button is the table you are about to add."],
      ["fit", "The add button is large enough to see.", "The table on the button is large enough to recognise."],
      ["words", "Export, next to the trash, is a downward arrow.", "Export is the arrow that means down, beside the other icons."],
      ["touch", "On the finished table menu, export is that same arrow, and copy is a clipboard icon that actually copies.", "The clipboard icon has to put the card on the clipboard."],
      ["touch", "Delete is a red trash icon. Removed tables go to a bin that can be emptied.", "Delete looks like throwing the table away, and the bin can still be emptied."],
      ["say", "Import and print are not part of the tool.", "The event is the room."],
      ["truth", "The room does not list which roles every pursuing table is still missing.", "The chairs already show who is missing."]
    ]
  },
  {
    id: "form",
    title: "Fill a table like a form",
    prompt: "A new table opens its own view, and is published to the room when it is ready.",
    asks: [
      ["path", "People move forward one step at a time. They do not skip ahead.", "Each step waits until the one before it is filled."],
      ["where", "The first screen asks only for the name.", "The table starts as a name."],
      ["path", "The progress bar fills gradually, rather than jumping.", "The bar fills as you move, so the step change is visible."],
      ["stay", "The “New table, 2 of 5” line comes off. The step row sits up with the line.", "The steps sit on the line you are already reading."],
      ["stay", "Back and onward stay on screen, at the bottom right, even on a short step.", "Back and onward stay on screen, including on a short step."],
      ["stay", "Choosing a decision does not jump the page.", "Choosing a decision leaves you at the place you clicked."],
      ["words", "Closing lines at the end of a step, and the grey rule above them, come off.", "The path already leads to the next step."],
      ["words", "Domain buttons do not carry extra descriptions.", "The domain name is the button."],
      ["path", "Who carries it, and why today falls short, stays optional and folded.", "Optional detail stays folded, so it does not become another required step."],
      ["touch", "The four value lines are statements you click on and off, under “Where can quantum help?”", "A statement is something you can agree with by clicking it."],
      ["words", "The decision step opens on the three choices.", "The step is the choice."],
      ["say", "There is no 25-minute clock.", "A clock would make the table look like a timed exercise."],
      ["say", "The kept card is titled “Your table menu.”", "The screen is the menu for that table."],
      ["say", "Prompt examples are labelled “These are conversation starters.”", "An example from 2023 is a way into the conversation."]
    ]
  },
  {
    id: "decision",
    title: "Decisions on one line",
    prompt: "Pursue, Keep watching, and Not for quantum are one row.",
    asks: [
      ["fit", "The three decisions sit on one line, on the decision step and on the finished menu.", "The three choices are one comparison, so they share a line."],
      ["fit", "The action word is aligned to the top of each button, so a short label lines up with a wrapping one.", "The action words share a top edge, so you can compare them when a label wraps."]
    ]
  },
  {
    id: "who",
    title: "Who is at the table",
    prompt: "The people are the buttons, and the picture builds from who is here.",
    asks: [
      ["words", "The step is called “Who is at the table?” The black line under the heading comes off, with space before the buttons.", "The question is the step."],
      ["fit", "Every participant is a button, and the buttons fit on one row.", "The people at one table are one row."],
      ["words", "The descriptions inside those buttons come off.", "The role name is the button."],
      ["seat", "The labels are Challenge owner, Domain expert, Quantum expert, and Innovation & commerce expert.", "The four names are the four seats."],
      ["seat", "Societal, legal or ethical is not a button and not a chair.", "The chairs match the roles the table actually uses."],
      ["touch", "Here and Still looking are not two buttons. The card is the person.", "Presence is the card itself."],
      ["touch", "Clicking a person’s card turns it, and the name and organisation are written on the back.", "The person is the card. Turning it is how you write their name."],
      ["room", "When the card is not turned, the role is in capitals.", "The front of the card reads as a place card."],
      ["fit", "The card grows so the name and organisation are fully visible.", "The card grows until the name and organisation are on it."],
      ["truth", "The picture builds under the buttons, and only the people marked here appear.", "Marking someone here adds their seat under the buttons."]
    ]
  },
  {
    id: "picture",
    title: "The picture of the table",
    prompt: "A standing view of the supplied drawing.",
    asks: [
      ["room", "The view is as if you were photographing the people at the table, standing in front of it.", "You see the table the way you would if you walked up to it."],
      ["truth", "Use the supplied image.", "The chairs are the drawing you supplied."],
      ["truth", "The table has one leg, the centre pedestal.", "The table keeps the single pedestal from that drawing."],
      ["truth", "Front and back chairs come from the supplied SVGs.", "The chairs come from the SVGs you added."],
      ["room", "Back chairs sit high enough that their backrests continue the arc of the front chairs.", "The backrests continue one curve, so the chairs belong to one view."],
      ["room", "Chairs sit with the table, at a size that belongs to it.", "The chairs belong to the table, close to it."],
      ["seat", "From left to right: challenge owner, domain expert, quantum expert, innovation and commerce expert.", "Left to right is fixed."],
      ["seat", "The challenge owner is the leftmost chair, in QDNL blue.", "The owner is the leftmost chair, in the same blue as a prompt."],
      ["truth", "In the room, each table shows only the people who are actually there.", "The floor uses the same rule as the form: a seat is drawn when that person is here."]
    ]
  },
  {
    id: "shared",
    title: "One shared room",
    prompt: "The tables are the room, whichever window you open.",
    asks: [
      ["shared", "The same tables are saved on the host.", "The tables live with the site, in one place."],
      ["shared", "Anyone who opens the site sees that shared set, including an incognito window.", "Another window, including a private one, opens the same room."],
      ["shared", "A change in one browser is written back, so the next person sees it.", "A change is written back, so the next person sees it."]
    ]
  }
];

GROUPS.forEach((group) => {
  group.asks = group.asks.map(([why, text, because]) => ({ why, text, because }));
});

let topic = "all";
let why = "all";
const principlesEl = document.getElementById("principles");
const cats = document.getElementById("cats");
const list = document.getElementById("list");
const count = document.getElementById("count");
const q = document.getElementById("q");

function principleById(id) {
  return PRINCIPLES.find((item) => item.id === id);
}

function esc(value) {
  return String(value).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function chips(el, items, current) {
  el.innerHTML = items.map((item) => {
    const on = item.id === current;
    return '<button type="button" data-id="' + item.id + '"' + (on ? ' class="on"' : "") + ' aria-pressed="' + (on ? "true" : "false") + '">' + esc(item.title) + "</button>";
  }).join("");
}

function drawPrinciples() {
  principlesEl.innerHTML = PRINCIPLES.map((item) => {
    const on = item.id === why;
    return '<button type="button" data-id="' + item.id + '"' + (on ? ' class="on"' : "") + ' aria-pressed="' + (on ? "true" : "false") + '"><strong>' + esc(item.title) + "</strong><span>" + esc(item.line) + "</span></button>";
  }).join("");
}

function visible() {
  const query = q.value.trim().toLowerCase();
  return GROUPS.filter((group) => topic === "all" || group.id === topic).map((group) => {
    const asks = group.asks.filter((ask) => {
      if (why !== "all" && ask.why !== why) return false;
      if (!query) return true;
      const principle = principleById(ask.why);
      return (group.title + " " + group.prompt + " " + ask.text + " " + ask.because + " " + principle.title + " " + principle.line).toLowerCase().includes(query);
    });
    return { ...group, asks };
  }).filter((group) => group.asks.length);
}

function draw() {
  const groups = visible();
  const total = groups.reduce((sum, group) => sum + group.asks.length, 0);
  const all = GROUPS.reduce((sum, group) => sum + group.asks.length, 0);
  count.textContent = total === all ? all + " asks" : total + " of " + all;
  list.innerHTML = groups.length ? groups.map((group) => (
    '<article><p class="ask">' + esc(group.prompt) + "</p><h2>" + esc(group.title) + "</h2><ul>" +
    group.asks.map((ask) => {
      const principle = principleById(ask.why);
      return "<li><span class=\"why\">" + esc(principle.title) + "</span>" + esc(ask.text) + "<span class=\"because\">" + esc(ask.because) + "</span></li>";
    }).join("") + "</ul></article>"
  )).join("") : '<p class="empty">Nothing matches.</p>';
}

principlesEl.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  why = why === button.dataset.id ? "all" : button.dataset.id;
  drawPrinciples();
  draw();
});
cats.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  topic = button.dataset.id;
  chips(cats, [{ id: "all", title: "All" }].concat(GROUPS.map((group) => ({ id: group.id, title: group.title }))), topic);
  draw();
});
q.addEventListener("input", draw);
chips(cats, [{ id: "all", title: "All" }].concat(GROUPS.map((group) => ({ id: group.id, title: group.title }))), topic);
drawPrinciples();
draw();
</script>
</body>
</html>

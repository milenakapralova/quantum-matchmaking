<script>

    if (turningOn) {
      const input = document.querySelector('.person[data-role="' + act.dataset.role + '"] [data-slot]');
      if (input) input.focus();
    }
    revealSeat = "";
    return;
  }
  if (action === "copy") {
    const text = plainCard(session);
    const done = () => toast("Card copied");
    if (fallbackCopy(text)) { done(); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => toast("Copy failed."));
    else toast("Copy failed.");
    return;
  }
  if (action === "publish") {
    session.published = true;
    session.lastStep = STEPS.length;
    touch(session);
    return go({ name: "room", openId: session.id });
  }
  if (action === "export-one") return exportSessions([session]);
  if (action === "delete") {
    const item = db.sessions.find((entry) => entry.id === session.id);
    if (!item) return;
    item.trashed = Date.now();
    db.sessions = db.sessions.filter((entry) => entry.id !== item.id);
    db.trash.push(item);
    go({ name: "room" });
  }
});
function fallbackCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.top = "0";
  area.style.left = "0";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.focus();
  area.select();
  area.setSelectionRange(0, area.value.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  area.remove();
  return ok;
}
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || route.name !== "room" || !route.openId) return;
  route = { name: "room" };
  save();
  render();
});
render();
pullShared();
setInterval(pullShared, 12000);
</script>
</body>
